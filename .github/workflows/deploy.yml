name: Deploy demo
# Manual deployment of the public demo (Worker "webhook-relay-demo", relay.piotrmajkutewicz.pl).
# Requires the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The first run creates the D1 database; the demo signing secret is generated once and kept in the Worker.
on:
  workflow_dispatch:
concurrency:
  group: deploy-demo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi
      - name: Ensure the demo D1 database exists
        run: |
          set -e
          PLACEHOLDER="00000000-0000-0000-0000-000000000000"
          ID=$(npx wrangler d1 info webhook-relay-demo --json 2>/dev/null | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler d1 create webhook-relay-demo 2>&1)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          [ -n "$ID" ] || { echo "Could not determine the D1 database id." >&2; exit 1; }
          # Replace the placeholder only for the demo environment block (the second occurrence).
          python3 - "$ID" <<'PY'
          import sys
          p = 'wrangler.jsonc'
          s = open(p).read()
          ph = '00000000-0000-0000-0000-000000000000'
          i = s.index('"demo"')
          j = s.index(ph, i)
          s = s[:j] + sys.argv[1] + s[j + len(ph):]
          open(p, 'w').write(s)
          PY
      - run: npm run db:migrate:demo
      - run: npm run deploy:demo
      - name: Ensure the demo signing secret exists
        run: |
          set -e
          if npx wrangler secret list --env demo 2>/dev/null | grep -q '"DEMO_SOURCE_SECRET"'; then
            echo "DEMO_SOURCE_SECRET already set."
          else
            openssl rand -hex 32 | npx wrangler secret put DEMO_SOURCE_SECRET --env demo
          fi
